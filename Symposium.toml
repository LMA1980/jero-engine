name = "jero-engine"
# Crate-embedded Symposium manifest for jero-engine.

[[plugins]]
depends-on = ["jero-core"]
source.cargo = "jero-core"

[[plugins]]
depends-on = ["jero-kernels-rvv"]
source.cargo = "jero-kernels-rvv"

[[plugins]]
depends-on = ["jero-kv-cache"]
source.cargo = "jero-kv-cache"

[[plugins]]
depends-on = ["jero-tokenizer"]
source.cargo = "jero-tokenizer"

[[plugins]]
depends-on = ["jero-arch-gemma"]
source.cargo = "jero-arch-gemma"

[[plugins]]
depends-on = ["jero-arch-qwen"]
source.cargo = "jero-arch-qwen"

[[plugins]]
depends-on = ["jero-arch-encoder"]
source.cargo = "jero-arch-encoder"

[[plugins]]
depends-on = ["jero-arch-ssm"]
source.cargo = "jero-arch-ssm"

[[plugins]]
depends-on = ["jero-arch-machine"]
source.cargo = "jero-arch-machine"

[[plugins]]
depends-on = ["jero-arch-vision"]
source.cargo = "jero-arch-vision"

[[plugins]]
depends-on = ["jero-arch-whisper"]
source.cargo = "jero-arch-whisper"

[[installations]]
name = "jero-diag"
executable = "jero-diag"

[subcommand.jero-diag]
description = "Run SpacemiT K3 hardware capability probes, cluster affinity checks, and synthetic/model diagnostics"
audience = "agents"
command = "jero-diag"
predicates = ["path_exists(jero-diag)"]
