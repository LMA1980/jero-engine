name = "jero-engine"
# Crate-embedded Symposium manifest for jero-engine.

[[plugins]]
depends-on = ["jero-core"]
source.cargo = "jero-core"

[[plugins]]
depends-on = ["jero-kernels-rvv"]
source.cargo = "jero-kernels-rvv"

[[plugins]]
depends-on = ["jero-kv-cache"]
source.cargo = "jero-kv-cache"

[[plugins]]
depends-on = ["jero-tokenizer"]
source.cargo = "jero-tokenizer"

[[installations]]
name = "jero-diag"
executable = "jero-diag"

[subcommand.jero-diag]
description = "Run SpacemiT K3 hardware capability probes, cluster affinity checks, and synthetic/model diagnostics"
audience = "agents"
command = "jero-diag"
predicates = ["path_exists(jero-diag)"]
