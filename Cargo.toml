[package]
name = "jero-engine"
description = "Low-level compute runtime for the SpacemiT K3 AI platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/LMA1980/jero-engine"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[[bin]]
name = "jero-diag"
path = "src/bin/jero-diag/main.rs"
required-features = ["jero-kernels-rvv"]

[[bin]]
name = "jero-engine"
path = "src/bin/jero-engine/main.rs"

[[bin]]
name = "jero-worker"
path = "src/bin/jero-engine/main.rs"

[[test]]
name = "empirical_challenge_m4_bounds"
required-features = ["jero-arch-mistral"]

[dependencies]
arrow-array = "59.3.1"
arrow-buffer = "59.3.1"
fory = "1.7.7"
fory-derive = "1.7.7"
jero-arch-bitnet = { version = "0.1.0", git = "https://github.com/LMA1980/jero-arch-bitnet.git", branch = "feat/m10-multimodal-runtime", optional = true }
jero-arch-dory = { version = "0.1.0", git = "https://github.com/LMA1980/jero-arch-dory.git", branch = "feat/m10-multimodal-runtime", optional = true }
jero-arch-encoder = { version = "0.1.0", git = "https://github.com/LMA1980/jero-arch-encoder.git", branch = "feat/m10-multimodal-runtime", optional = true }
jero-arch-gemma = { version = "0.1.0", git = "https://github.com/LMA1980/jero-arch-gemma.git", branch = "feat/m10-multimodal-runtime", optional = true }
jero-arch-llama = { version = "0.1.0", git = "https://github.com/LMA1980/jero-arch-llama.git", branch = "feat/m10-multimodal-runtime", optional = true }
jero-arch-machine = { version = "0.1.0", git = "https://github.com/LMA1980/jero-arch-machine.git", branch = "feat/m10-multimodal-runtime", optional = true }
jero-arch-mistral = { version = "0.1.0", git = "https://github.com/LMA1980/jero-arch-mistral.git", branch = "feat/m10-multimodal-runtime", optional = true }
jero-arch-phi3 = { version = "0.1.0", git = "https://github.com/LMA1980/jero-arch-phi3.git", branch = "feat/m10-multimodal-runtime", optional = true }
jero-arch-qwen = { version = "0.1.0", git = "https://github.com/LMA1980/jero-arch-qwen.git", branch = "feat/m10-multimodal-runtime", optional = true }
jero-arch-ssm = { version = "0.1.0", git = "https://github.com/LMA1980/jero-arch-ssm.git", branch = "feat/m10-multimodal-runtime", optional = true }
jero-arch-synthetic = { version = "0.1.0", git = "https://github.com/LMA1980/jero-arch-synthetic.git", branch = "feat/m10-multimodal-runtime", optional = true }
jero-arch-vision = { version = "0.1.0", git = "https://github.com/LMA1980/jero-arch-vision.git", branch = "feat/m10-multimodal-runtime", optional = true }
jero-arch-whisper = { version = "0.1.0", git = "https://github.com/LMA1980/jero-arch-whisper.git", branch = "feat/m10-multimodal-runtime", optional = true }
jero-core = { version = "0.1.0", git = "https://github.com/LMA1980/jero-core.git", branch = "feat/m10-multimodal-runtime" }
jero-kernels-rvv = { version = "0.1.0", git = "https://github.com/LMA1980/jero-kernels-rvv.git", branch = "feat/m10-multimodal-runtime", optional = true }
jero-tokenizer = { version = "0.1.0", git = "https://github.com/LMA1980/jero-tokenizer.git", branch = "feat/m10-multimodal-runtime" }
libc = "0.2"
rayon = "1.12"
sendfd = "0.4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "signal", "time"] }
zerocopy = { version = "0.8.63", features = ["derive"] }

[features]
default = [
    "jero-arch-synthetic",
    "jero-arch-llama",
    "jero-arch-mistral",
    "jero-arch-phi3",
    "jero-arch-bitnet",
    "jero-arch-dory",
    "jero-arch-gemma",
    "jero-arch-qwen",
    "jero-arch-encoder",
    "jero-arch-ssm",
    "jero-arch-machine",
    "jero-arch-vision",
    "jero-arch-whisper",
    "jero-kernels-rvv",
]
# In-process architecture recipe and compute kernel feature gates (ADR-024)
jero-arch-synthetic = ["dep:jero-arch-synthetic"]
jero-arch-bitnet = ["dep:jero-arch-bitnet"]
jero-arch-dory = ["dep:jero-arch-dory"]
jero-arch-gemma = ["dep:jero-arch-gemma", "jero-kernels-rvv"]
jero-arch-qwen = ["dep:jero-arch-qwen"]
jero-arch-encoder = ["dep:jero-arch-encoder"]
jero-arch-ssm = ["dep:jero-arch-ssm", "jero-kernels-rvv"]
jero-arch-machine = ["dep:jero-arch-machine"]
jero-arch-vision = ["dep:jero-arch-vision"]
jero-arch-whisper = ["dep:jero-arch-whisper"]
jero-arch-llama = ["dep:jero-arch-llama"]
jero-arch-mistral = ["dep:jero-arch-mistral"]
jero-arch-modernbert = ["jero-arch-encoder"]
jero-arch-ttm = ["jero-arch-machine"]
jero-arch-ft-transformer = ["jero-arch-machine"]
jero-arch-tabpfn-v2 = ["jero-arch-machine"]
jero-arch-decision-transformer = ["jero-arch-machine"]
jero-arch-phi3 = ["dep:jero-arch-phi3"]
jero-kernels-rvv = [
    "dep:jero-kernels-rvv",
    "jero-arch-synthetic?/with-kernels",
    "jero-arch-bitnet?/with-kernels",
    "jero-arch-dory?/with-kernels",
    "jero-arch-gemma?/with-kernels",
    "jero-arch-qwen?/with-kernels",
    "jero-arch-encoder?/with-kernels",
    "jero-arch-ssm?/with-kernels",
    "jero-arch-machine?/with-kernels",
    "jero-arch-vision?/with-kernels",
    "jero-arch-whisper?/with-kernels",
    "jero-arch-llama?/with-kernels",
    "jero-arch-mistral?/with-kernels",
    "jero-arch-phi3?/with-kernels",
]
# Backward-compatible feature aliases
arch-synthetic = ["jero-arch-synthetic"]
arch-bitnet = ["jero-arch-bitnet"]
arch-dory = ["jero-arch-dory"]
arch-gemma = ["jero-arch-gemma"]
arch-qwen = ["jero-arch-qwen"]
arch-encoder = ["jero-arch-encoder"]
arch-ssm = ["jero-arch-ssm"]
arch-machine = ["jero-arch-machine"]
arch-vision = ["jero-arch-vision"]
arch-whisper = ["jero-arch-whisper"]
arch-llama = ["jero-arch-llama"]
arch-mistral = ["jero-arch-mistral"]
arch-modernbert = ["jero-arch-modernbert"]
arch-ttm = ["jero-arch-ttm"]
arch-ft-transformer = ["jero-arch-ft-transformer"]
arch-tabpfn-v2 = ["jero-arch-tabpfn-v2"]
arch-decision-transformer = ["jero-arch-decision-transformer"]
arch-phi3 = ["jero-arch-phi3"]
kernels-rvv = ["jero-kernels-rvv"]
