[package]
name = "k3-engine"
description = "Low-level compute runtime for the SpacemiT K3 AI platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/LMA1980/k3-engine"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[[bin]]
name = "k3-diag"
path = "src/bin/k3-diag/main.rs"
required-features = ["kernels-rvv"]

[[bin]]
name = "k3-worker"
path = "src/bin/k3-worker/main.rs"

[[test]]
name = "empirical_challenge_m4_bounds"
required-features = ["arch-mistral"]

[dependencies]
arch-synthetic = { version = "0.1.0", git = "https://github.com/LMA1980/k3-arch-synthetic.git", branch = "feat/m4-epic2-bitnet-tq1-tq2", optional = true }
arrow-array = "59.3.1"
arrow-buffer = "59.3.1"
fory = "1.7.7"
fory-derive = "1.7.7"
k3-arch-bitnet = { version = "0.1.0", git = "https://github.com/LMA1980/k3-arch-bitnet.git", branch = "feat/m4-epic2-bitnet-tq1-tq2", optional = true }
k3-arch-llama = { version = "0.1.0", git = "https://github.com/LMA1980/k3-arch-llama.git", branch = "feat/m4-epic2-bitnet-tq1-tq2", optional = true }
k3-arch-mistral = { version = "0.1.0", git = "https://github.com/LMA1980/k3-arch-mistral.git", branch = "feat/m4-epic2-bitnet-tq1-tq2", optional = true }
k3-arch-phi3 = { version = "0.1.0", git = "https://github.com/LMA1980/k3-arch-phi3.git", branch = "feat/m4-epic2-bitnet-tq1-tq2", optional = true }
k3-core = { version = "0.1.0", git = "https://github.com/LMA1980/k3-core.git", branch = "feat/m4-epic2-bitnet-tq1-tq2" }
k3-tokenizer = { version = "0.1.0", git = "https://github.com/LMA1980/k3-tokenizer.git", branch = "feat/m4-epic2-bitnet-tq1-tq2" }
kernels-rvv = { version = "0.1.0", git = "https://github.com/LMA1980/k3-kernels-rvv.git", branch = "feat/m4-epic2-bitnet-tq1-tq2", optional = true }
libc = "0.2"
rayon = "1.12"
sendfd = "0.4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "signal", "time"] }
zerocopy = { version = "0.8.63", features = ["derive"] }

[features]
default = ["arch-synthetic", "arch-llama", "arch-mistral", "arch-phi3", "arch-bitnet", "kernels-rvv"]
# In-process architecture recipe and compute kernel feature gates (ADR-024)
arch-synthetic = ["dep:arch-synthetic"]
arch-bitnet = ["dep:k3-arch-bitnet"]
arch-llama = ["dep:k3-arch-llama"]
arch-mistral = ["dep:k3-arch-mistral"]
arch-phi3 = ["dep:k3-arch-phi3"]
kernels-rvv = [
    "dep:kernels-rvv",
    "arch-synthetic?/with-kernels",
    "k3-arch-bitnet?/with-kernels",
    "k3-arch-llama?/with-kernels",
    "k3-arch-mistral?/with-kernels",
    "k3-arch-phi3?/with-kernels",
]
